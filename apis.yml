name: Leaba Semiconductor
description: 'Leaba Semiconductor was an Israeli fabless semiconductor startup founded
  in 2014 in Caesarea by Eyal Dagan (CEO) and Ofer Iny (CTO), the founders who had
  previously sold Dune Networks to Broadcom in 2009. Leaba designed high-end networking
  silicon — switch and router ASICs for carrier-class packet processing — and was
  backed by Bessemer Venture Partners and Pitango Venture Capital. Cisco announced
  its intent to acquire the roughly 45-person company on 2 March 2016 for about $320
  million in cash and assumed equity awards plus retention incentives, before Leaba
  had shipped a product; the deal was widely characterized as an acquisition of
  next-generation semiconductor talent and design IP. The Leaba team became the anchor
  of Cisco''s Israel silicon engineering center, and its technology underpins Cisco
  Silicon One, launched in December 2019 as the programmable networking chip family
  behind the Cisco 8000 Series carrier-class routers. Leaba never operated an
  independent developer program, public API, or SDK surface, and the leaba.com domain
  no longer serves a website. This profile is retained as an acquired-company record
  in the API Evangelist network.'
